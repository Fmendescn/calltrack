services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caltrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caltrack}
      POSTGRES_DB: ${POSTGRES_DB:-caltrack}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
